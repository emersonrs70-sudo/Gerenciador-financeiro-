<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FintechCore — Gestão Financeira Inteligente</title>
    <meta name="description" content="Um sistema premium de controle financeiro pessoal, com receitas, despesas, gráficos interativos, metas de sonhos e consultoria financeira integrada." />
    <meta property="og:title" content="FintechCore" />
    <meta property="og:description" content="Um sistema premium de controle financeiro pessoal, com receitas, despesas, gráficos interativos, metas de sonhos e consultoria financeira integrada." />
    
    <!-- Modern Typography: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- PWA primary configs and Manifest -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#121214" />
    <link rel="icon" type="image/png" href="./icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-512.png" />
    
    <!-- iOS / Safari PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FintechCore" />
    <link rel="apple-touch-icon" href="./icon-512.png" />
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => console.log('FintechCore Service Worker registrado com sucesso:', reg.scope))
            .catch((err) => console.error('Erro ao registrar Service Worker do FintechCore:', err));
        });
      }
    </script>
  </head>
  <body class="bg-[#F8F8FA] text-zinc-900 dark:bg-[#121214] dark:text-zinc-100 min-h-screen select-none antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
